<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Café Food Ordering System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">
    <h1>Campus Café Food Ordering System</h1>

    <form id="orderForm">

    <fieldset>
        <legend>Customer Information</legend>
        <div class="row">
            <div class="input-box">
                <label for="name">Full Name</label>
                <input type="text"id="name"placeholder="Enter Full Name">
                <small id="nameError"></small>
            </div>

            <div class="input-box">
                <label for="email">Email</label>
                <input type="email"id="email"placeholder="Enter Email">
                <small id="emailError"></small>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label for="phone">Phone Number</label>
                <input type="text"id="phone"placeholder="Enter Phone Number">
                <small id="phoneError"></small>
            </div>

            <div class="input-box">
                <label for="studentId">Student ID</label>
                <input type="text"id="studentId"placeholder="Enter Student ID">
                <small id="idError"></small>
            </div>
        </div>

        <label>Gender</label>
        <div class="radio-group">
            <label><input type="radio"name="gender"value="Male">Male</label>
            <label><input type="radio"name="gender"value="Female">Female</label>
        </div>
        <small id="genderError"></small>

        <div class="row">
            <div class="input-box">
                <label for="department">Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="EEE">EEE</option>
                    <option value="BBA">BBA</option>
                    <option value="English">English</option>
                    <option value="Other">Other</option>
                </select>
                <small id="departmentError"></small>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Food Selection</legend>
        <div class="checkbox-group">
            <label><input type="checkbox"name="food"value="Burger">Burger ($5)</label>
            <label><input type="checkbox"name="food"value="Pizza">Pizza ($8)</label>
            <label><input type="checkbox"name="food"value="Sandwich">Sandwich ($4)</label>
            <label><input type="checkbox"name="food"value="French Fries">French Fries ($3)</label>
            <label><input type="checkbox"name="food"value="Coffee">Coffee ($2)</label>
            <label><input type="checkbox"name="food"value="Cold Drink">Cold Drink ($2)</label>
        </div>
        <small id="foodError"></small>

        <div class="row">
            <div class="input-box">
                <label for="quantity">Quantity</label>
                <input type="number"id="quantity"min="1">
                <small id="quantityError"></small>
            </div>
        </div>

        <div class="row">
            <div class="full-box">
                <label for="instruction">Special Instructions</label>
                <textarea id="instruction"rows="5"placeholder="Write here..."></textarea>
            </div>
        </div>
    </fieldset>

    <div class="button-group">

        <button type="submit">Place Order</button>
        <button type="reset">Reset</button>
    </div>

    <div id="result"></div>

    </form>
</div>

<script src="script.js"></script>

</body>
</html>
